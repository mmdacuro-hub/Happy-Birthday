<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Birthday Surprise 💗</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="hearts"></div>
<button id="theme" aria-label="Toggle light or dark">🌙</button>

<!-- 1. GATE -->
<section class="view active" id="gate">
  <div class="glass gate">
    <div class="cake">🎂</div>
    <h1>Enter Your Code</h1>

    <p class="sub" style="margin-inline:auto">
      Hint: the day you came into this world (MMDDYYYY)
    </p>

    <input
      id="code"
      inputmode="numeric"
      autocomplete="off"
      maxlength="8"
      placeholder="MMDDYYYY"
      aria-label="Birthday code"
    >

    <div id="msg" role="status"></div>

    <button class="btn" id="go">Unlock 💗</button>
  </div>
</section>

<!-- 2. MENU -->
<section class="view" id="menu">

  <h1 id="hb">Happy Birthday!</h1>

  <div class="cards">

    <button class="opt glass" data-go="letter">
      <span class="ic">💌</span>
      <b>Letter</b>
      <small>Words from my heart</small>
    </button>

    <button class="opt glass" data-go="photos">
      <span class="ic">📸</span>
      <b>Memories</b>
      <small>Our favorite moments</small>
    </button>

    <button class="opt glass" data-go="song">
      <span class="ic">🎶</span>
      <b>Song</b>
      <small>A tune for you</small>
    </button>

  </div>
</section>

<!-- 3. LETTER -->
<section class="view" id="letter">

  <button class="back" data-go="menu">← Back</button>

  <button id="env" aria-label="Open the letter">💌</button>

  <p class="sub" id="envhint">
    Tap the envelope to open it
  </p>

  <div class="paper" id="paper" style="display:none"></div>

</section>

<!-- 4. PHOTOS -->
<section class="view" id="photos">

  <button class="back" data-go="menu">← Back</button>

  <h2>Our Memories</h2>

  <p class="sub">
    Tap a photo to see it up close
  </p>

  <div class="grid" id="grid"></div>

</section>

<!-- 5. SONG -->
<section class="view" id="song">

  <button class="back" data-go="menu">← Back</button>

  <h2>💗💗💗</h2>

  <div class="disc" id="disc">💗</div>

  <div class="eq" id="eq">
    <i></i>
    <i></i>
    <i></i>
    <i></i>
    <i></i>
  </div>

  <p class="sub">
    A special song just for you 💕
  </p>

  <button class="btn" id="play">▶ Play</button>

  <!-- YOUTUBE PLAYER -->
  <div
    id="ytPlayer"
    style="
      width:100%;
      max-width:560px;
      margin:22px auto 0;
      border-radius:15px;
      overflow:hidden;
    "
  ></div>

</section>

<!-- PHOTO LIGHTBOX -->
<div id="lb"></div>

<!-- JAVASCRIPT -->
<script src="script.js"></script>

</body>
</html>
